name: Build pinned emulator packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - id: matrix
        run: |
          set -euo pipefail
          echo "matrix=$(python3 tools/emulators.py matrix --directory packages/v3)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: builder
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: upstream
          submodules: recursive
          persist-credentials: false
      - name: Verify the pins and build the package
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/tools/build_package.py \
            --spec "builder/packages/v3/${{ matrix.id }}.json" \
            --workspace . \
            --output "dist/${{ matrix.id }}" \
            --container
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-${{ matrix.id }}-${{ matrix.commit }}
          path: dist/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14
